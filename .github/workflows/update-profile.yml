name: Publish profile

on:
  push:
    branches:
      - main
    paths:
      - "explorations/**"
      - "!explorations/README.md"
      - "profile/**"
      - "scripts/build_profile.py"
      - "tests/**"
      - ".github/workflows/update-profile.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Profile Publisher
        run: python3 -m unittest -v tests/test_build_profile.py

      - name: Generate profile
        env:
          PROFILE_PRIVATE_TERMS: ${{ secrets.PROFILE_PRIVATE_TERMS }}
        run: python3 scripts/build_profile.py --root .

      - name: Verify generated scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$({
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u | grep -vE '^(README\.md|explorations/README\.md)$' || true)"

          if [[ -n "$unexpected" ]]; then
            echo "Profile Publisher changed files outside its allowed outputs:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit generated profile
        shell: bash
        run: |
          set -euo pipefail
          git add README.md explorations/README.md

          unexpected_staged="$(
            git diff --cached --name-only |
              grep -vE '^(README\.md|explorations/README\.md)$' || true
          )"
          if [[ -n "$unexpected_staged" ]]; then
            echo "Refusing to commit files outside generated surfaces." >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Generated profile is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish profile"
          git push
